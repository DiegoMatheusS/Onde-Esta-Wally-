<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calibrar pontos - Onde Está Wally?</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff;overflow:hidden}
    .top{position:sticky;z-index:10;top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:rgba(20,20,20,.96);border-bottom:1px solid #444}
    .top strong{margin-right:8px}.top select,.top input,.top button,.top a{height:38px;border-radius:9px;border:1px solid #666;padding:0 10px;background:#222;color:#fff;text-decoration:none}
    .top button{cursor:pointer}.navbtn{font-weight:800}.hint{padding:9px 14px;background:#7e0b18;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .status{font-weight:800}.wrap{height:calc(100vh - 106px);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .stage{position:relative;display:inline-block;line-height:0;cursor:crosshair}.stage img{display:block;max-width:100vw;max-height:calc(100vh - 106px);width:auto;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
    .box{position:absolute;border:3px solid #ff3048;background:rgba(255,48,72,.12);pointer-events:none}.cross{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#00eaff}.cross:before{left:9px;top:0;width:2px;height:20px}.cross:after{left:0;top:9px;width:20px;height:2px}
    .coords{font-variant-numeric:tabular-nums;color:#bff7ff}.pending{color:#ffd86b}.ok{color:#8cf6a6}
    @media(max-width:760px){.top{font-size:12px}.top label{display:none}.wrap{height:calc(100vh - 138px)}.stage img{max-height:calc(100vh - 138px)}}
  </style>
</head>
<body>
  <div class="top">
    <strong>Calibrador</strong>
    <button id="prevBtn" class="navbtn" type="button">←</button>
    <select id="phaseSelect"></select>
    <button id="nextBtn" class="navbtn" type="button">→</button>
    <label>Largura % <input id="wInput" type="number" min="0.5" max="15" step="0.1" value="3"></label>
    <label>Altura % <input id="hInput" type="number" min="1" max="20" step="0.1" value="9"></label>
    <span id="coords" class="coords">x -- / y --</span>
    <button id="resetBtn" type="button">Restaurar padrão</button>
    <a href="index.html">Voltar ao jogo</a>
  </div>
  <div class="hint">
    <span>Clique exatamente no centro do Wally. A posição fica salva automaticamente neste navegador.</span>
    <span id="status" class="status pending">Não calibrada</span>
  </div>
  <div class="wrap">
    <div id="stage" class="stage">
      <img id="img" draggable="false" alt="Imagem para calibrar">
      <div id="box" class="box"></div>
      <div id="cross" class="cross"></div>
    </div>
  </div>
<script>
const PHASES=[
{id:'metro',name:'Estação',src:'assets/fases/metro.jpg',target:{x:47.8,y:44,w:3.2,h:9.2}},
{id:'fabrica',name:'Fábrica de Bolos',src:'assets/fases/fabrica-bolos.jpg',target:{x:49.8,y:22.5,w:2.8,h:8.2}},
{id:'multidao',name:'Multidão',src:'assets/fases/multidao.jpg',target:{x:62.5,y:44,w:3.8,h:10}},
{id:'loja',name:'Loja',src:'assets/fases/loja.jpg',target:{x:40.8,y:20.5,w:3.4,h:10.5}},
{id:'parque',name:'Parque',src:'assets/fases/parque.jpg',target:{x:60.5,y:57,w:3,h:8.8}},
{id:'praia',name:'Praia',src:'assets/fases/praia.jpg',target:{x:62.2,y:39,w:3.3,h:10}},
{id:'centro-olimpico',name:'Centro Olímpico',src:'assets/fases/centro-olimpico.jpg',target:{x:50,y:50,w:3,h:9}},
{id:'teatro',name:'Estúdio de Cinema',src:'assets/fases/teatro.webp',target:{x:50,y:50,w:3,h:9}},
{id:'esqui',name:'Estação de Esqui',src:'assets/fases/esqui.webp',target:{x:50,y:50,w:3,h:9}},
{id:'troia',name:'Troia',src:'assets/fases/troia.webp',target:{x:50,y:50,w:3,h:9}},
{id:'pirata',name:'Piratas',src:'assets/fases/pirata.webp',target:{x:50,y:50,w:3,h:9}},
{id:'frutas',name:'Mundo das Frutas',src:'assets/fases/frutas.webp',target:{x:50,y:50,w:3,h:9}},
{id:'pascoa',name:'Páscoa',src:'assets/fases/pascoa.png',target:{x:50,y:50,w:3,h:9}}
];
const KEY='ondeEstaWallyHitboxesV1';
const $=id=>document.getElementById(id);let current=PHASES[0];
function all(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function saved(){return all()[current.id]}
function value(){return saved()||current.target}
function setStatus(){const ok=!!saved();$('status').textContent=ok?'Calibrada ✓':'Não calibrada';$('status').className='status '+(ok?'ok':'pending')}
function save(v){const o=all();o[current.id]=v;localStorage.setItem(KEY,JSON.stringify(o));render(v);setStatus()}
function render(v=value()){$('coords').textContent=`x ${v.x.toFixed(2)}% / y ${v.y.toFixed(2)}%`;$('wInput').value=v.w;$('hInput').value=v.h;$('box').style.left=(v.x-v.w/2)+'%';$('box').style.top=(v.y-v.h/2)+'%';$('box').style.width=v.w+'%';$('box').style.height=v.h+'%';$('cross').style.left=v.x+'%';$('cross').style.top=v.y+'%';setStatus()}
function load(){current=PHASES.find(p=>p.id===$('phaseSelect').value)||PHASES[0];$('img').src=current.src;$('img').onload=()=>render()}
function move(dir){let i=PHASES.findIndex(p=>p.id===current.id);i=(i+dir+PHASES.length)%PHASES.length;$('phaseSelect').value=PHASES[i].id;load()}
PHASES.forEach((p,i)=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${i+1}. ${p.name}`;$('phaseSelect').append(o)});
$('phaseSelect').addEventListener('change',load);$('prevBtn').addEventListener('click',()=>move(-1));$('nextBtn').addEventListener('click',()=>move(1));
$('stage').addEventListener('click',e=>{const r=$('stage').getBoundingClientRect();const x=(e.clientX-r.left)/r.width*100;const y=(e.clientY-r.top)/r.height*100;const v=value();save({x,y,w:Number($('wInput').value)||v.w,h:Number($('hInput').value)||v.h})});
['wInput','hInput'].forEach(id=>$(id).addEventListener('input',()=>{const v=value();save({...v,w:Number($('wInput').value)||v.w,h:Number($('hInput').value)||v.h})}));
$('resetBtn').addEventListener('click',()=>{const o=all();delete o[current.id];localStorage.setItem(KEY,JSON.stringify(o));render(current.target)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
load();
</script>
</body>
</html>
